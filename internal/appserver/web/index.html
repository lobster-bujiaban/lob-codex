<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="LOB Codex - 用 Go 等价实现 Codex Harness">
  <title>LOB Codex · 用 Go 读懂 Codex</title>
  <style>
    :root {
      --paper: #fbfaf7;
      --canvas: #f3efe7;
      --surface: #ffffff;
      --surface-warm: #fff8ee;
      --ink: #172d4f;
      --ink-soft: #40536e;
      --muted: #7b8798;
      --line: #e6dfd4;
      --orange: #ed5a2a;
      --orange-dark: #c9421b;
      --orange-soft: #fff0e7;
      --navy: #17335e;
      --green: #24855b;
      --red: #c9463d;
      --shadow: 0 18px 50px rgba(37, 49, 67, .09);
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { overflow: hidden; background: var(--canvas); color: var(--ink); font: 14px/1.6 var(--font); }
    button, textarea { font: inherit; }
    button { color: inherit; }

    .app-shell { display: grid; grid-template-columns: 276px minmax(0, 1fr); height: 100vh; }
    .sidebar {
      display: flex; flex-direction: column; min-height: 0; padding: 24px 18px 18px;
      background: #f8f4ec; border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 5px 22px; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .brand-logo {
      width: 48px; height: 48px; object-fit: cover; border-radius: 15px;
      background: #fff; box-shadow: 0 6px 18px rgba(201, 66, 27, .12);
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 18px; letter-spacing: -.02em; }
    .brand-copy span { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }

    .project-card {
      padding: 16px; border: 1px solid #f0d9ca; border-radius: 16px;
      background: linear-gradient(145deg, #fff9f1, #fff3e8);
    }
    .eyebrow { margin: 0 0 7px; color: var(--orange-dark); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .project-card h2 { margin: 0; font-size: 16px; }
    .project-card p { margin: 7px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.65; }
    .progress { display: flex; gap: 5px; margin-top: 14px; }
    .progress span { flex: 1; height: 4px; border-radius: 4px; background: #eadfd4; }
    .progress .done { background: var(--orange); }

    .section-label { margin: 24px 7px 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    .concept-list { display: grid; gap: 5px; }
    .concept {
      display: flex; align-items: center; gap: 10px; padding: 10px 11px;
      width: 100%; border: 0; border-radius: 11px; background: transparent; color: var(--ink-soft); font-size: 12px;
      text-align: left; cursor: pointer;
    }
    .concept:hover { background: #f0ebe3; color: var(--ink); }
    .concept.active { background: #ebe5db; color: var(--ink); font-weight: 650; }
    .concept-index {
      display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 auto;
      border: 1px solid #d9d1c5; border-radius: 8px; background: #fff; color: var(--orange-dark);
      font: 700 10px/1 var(--font);
    }
    .concept.active .concept-index { border-color: var(--orange); background: var(--orange); color: #fff; }

    .sidebar-bottom { margin-top: auto; }
    .social-title { margin: 0 0 8px 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
    .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .social-card {
      display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; padding: 9px 6px;
      border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.72); cursor: pointer;
    }
    .social-card:hover { border-color: #efb99f; background: #fff; }
    .social-card img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; }
    .social-card.douyin img { object-position: 50% 39%; }
    .social-card strong { overflow: hidden; max-width: 100%; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .qr-dialog { width: min(420px, calc(100vw - 28px)); padding: 0; border: 0; border-radius: 20px; background: #fff; color: var(--ink); box-shadow: 0 24px 80px rgba(23,45,79,.25); }
    .qr-dialog::backdrop { background: rgba(23,45,79,.42); backdrop-filter: blur(3px); }
    .qr-dialog-inner { position: relative; padding: 24px; text-align: center; }
    .qr-dialog h2 { margin: 0; font-size: 18px; }
    .qr-dialog p { margin: 5px 0 16px; color: var(--muted); font-size: 12px; }
    .qr-dialog img { display: block; width: 100%; max-height: 570px; margin: 0 auto; border-radius: 13px; object-fit: contain; }
    .qr-dialog-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #f0ece5; cursor: pointer; }
    .repo-link { display: block; margin-top: 12px; color: var(--muted); font-size: 10px; text-align: center; text-decoration: none; }
    .repo-link:hover { color: var(--orange-dark); }

    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--paper); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; height: 72px;
      padding: 0 30px; border-bottom: 1px solid var(--line); background: rgba(251,250,247,.92);
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .home-button {
      padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--ink-soft); font-size: 11px; cursor: pointer;
    }
    .home-button:hover { border-color: #efb99f; color: var(--orange-dark); }
    .page-title span { display: block; color: var(--muted); font-size: 11px; }
    .page-title strong { display: block; margin-top: 1px; font-size: 15px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px;
      border: 1px solid #cfe5d8; border-radius: 999px; background: #f3fbf6; color: var(--green); font-size: 11px; font-weight: 650;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(36,133,91,.1); }

    .conversation { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
    #messages {
      display: flex; flex-direction: column; gap: 22px; width: min(820px, calc(100% - 56px));
      min-height: 100%; margin: 0 auto; padding: 38px 0 190px;
    }
    .welcome { display: grid; justify-items: center; margin: auto 0; padding: 35px 0 70px; text-align: center; }
    .welcome-logo { width: 128px; height: 128px; object-fit: cover; border-radius: 34px; background: #fff; box-shadow: var(--shadow); }
    .welcome h1 { margin: 20px 0 5px; font-size: 25px; letter-spacing: -.03em; }
    .welcome > p { max-width: 470px; margin: 0; color: var(--muted); font-size: 13px; }
    .prompt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: min(680px, 100%); margin-top: 27px; }
    .prompt-chip {
      min-height: 76px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 14px;
      background: #fff; color: var(--ink-soft); text-align: left; cursor: pointer; transition: .18s ease;
    }
    .prompt-chip:hover { transform: translateY(-2px); border-color: #efb99f; box-shadow: 0 10px 24px rgba(54, 63, 74, .08); }
    .prompt-chip span { display: block; margin-bottom: 3px; color: var(--orange-dark); font-size: 10px; font-weight: 750; letter-spacing: .08em; }

    .message { display: flex; gap: 11px; max-width: 84%; animation: enter .22s ease both; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }
    .avatar {
      display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto;
      border-radius: 11px; overflow: hidden; background: var(--navy); color: #fff; font-size: 11px; font-weight: 750;
    }
    .assistant .avatar { border: 1px solid #f0d9ca; background: var(--orange-soft); }
    .assistant .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .bubble { padding: 12px 15px; border-radius: 5px 17px 17px 17px; white-space: pre-wrap; word-break: break-word; line-height: 1.75; }
    .assistant .bubble { border: 1px solid var(--line); background: #fff; box-shadow: 0 7px 22px rgba(37,49,67,.045); }
    .user .bubble { border-radius: 17px 5px 17px 17px; background: var(--navy); color: #fff; }
    .message.error .bubble { border-color: #efc0bc; background: #fff5f4; color: var(--red); }
    .tool-call {
      align-self: flex-start; width: min(620px, 88%); padding: 13px 15px;
      border: 1px solid #d8d2ef; border-radius: 14px; background: #faf9ff; color: var(--ink-soft);
      animation: enter .22s ease both;
    }
    .tool-call-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tool-call-name { color: #5b4ba8; font-size: 12px; font-weight: 750; }
    .tool-call-status { color: var(--muted); font-size: 10px; }
    .tool-call.completed .tool-call-status { color: var(--green); }
    .tool-call pre { overflow-x: auto; margin: 8px 0 0; color: #53627a; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .tool-call-output { margin-top: 9px; padding-top: 9px; border-top: 1px solid #e4e0f2; font-size: 12px; }
    .approval-card { align-self: flex-start; width: min(620px, 90%); padding: 16px; border: 1px solid #efb99f; border-radius: 16px; background: #fff8ee; animation: enter .22s ease both; }
    .approval-card h3 { margin: 0; color: var(--orange-dark); font-size: 14px; }
    .approval-card p { margin: 5px 0 10px; color: var(--muted); font-size: 11px; }
    .approval-card pre { overflow-x: auto; margin: 0; padding: 10px; border-radius: 10px; background: #172d4f; color: #fff; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .approval-actions { display: flex; gap: 8px; margin-top: 12px; }
    .approval-actions button { padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
    .approval-actions .approve { border-color: var(--orange); background: var(--orange); color: #fff; }
    .approval-actions button:disabled { opacity: .55; cursor: default; }
    .approval-result { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .typing::after { content: ""; display: inline-block; width: 5px; height: 14px; margin-left: 4px; background: var(--orange); vertical-align: -2px; animation: blink .7s infinite alternate; }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } }
    @keyframes blink { to { opacity: .15; } }

    .composer-dock {
      position: absolute; right: 0; bottom: 0; left: 276px; padding: 44px 24px 16px;
      background: linear-gradient(transparent, var(--paper) 35%);
    }
    .composer-wrap { width: min(840px, 100%); margin: 0 auto; }
    form {
      display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 16px;
      border: 1px solid #dcd4c8; border-radius: 20px; background: #fff; box-shadow: var(--shadow);
    }
    textarea {
      flex: 1; min-height: 44px; max-height: 170px; resize: none; padding: 10px 0 7px;
      border: 0; outline: 0; background: transparent; color: var(--ink); line-height: 1.55;
    }
    textarea::placeholder { color: #a4abb5; }
    .send-button {
      display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto;
      border: 0; border-radius: 13px; background: var(--orange); color: #fff; cursor: pointer;
      box-shadow: 0 7px 16px rgba(237,90,42,.24); transition: .18s ease;
    }
    .send-button:hover { background: var(--orange-dark); transform: translateY(-1px); }
    .send-button:disabled { opacity: .48; cursor: wait; transform: none; }
    .send-button svg { width: 19px; height: 19px; }
    .composer-meta { display: flex; justify-content: space-between; padding: 7px 5px 0; color: var(--muted); font-size: 10px; }
    .composer-meta strong { color: var(--orange-dark); font-weight: 650; }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .composer-dock { left: 0; }
      .topbar { padding: 0 18px; }
      #messages { width: calc(100% - 28px); padding-top: 25px; }
      .prompt-grid { grid-template-columns: 1fr; }
      .welcome { padding-top: 10px; }
      .message { max-width: 94%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="项目导航">
      <button id="home-brand" class="brand" type="button" aria-label="返回首页">
        <img class="brand-logo" src="/lobster-logo.png" alt="虾哥不加班 Logo">
        <div class="brand-copy"><strong>LOB Codex</strong><span>用 Go 读懂 Codex Harness</span></div>
      </button>

      <section class="project-card">
        <p class="eyebrow">Open Source Lab</p>
        <h2>源码等价实现计划</h2>
        <p>沿 Codex 真实调用链逐层复现，不重新设计另一套 Harness。</p>
        <div class="progress" aria-label="当前实现进度"><span class="done"></span><span class="done"></span><span></span><span></span><span></span></div>
      </section>

      <p class="section-label">当前学习主链</p>
      <nav class="concept-list">
        <button class="concept active" type="button" data-topic="Session / Turn / Step"><span class="concept-index">01</span><span>Session / Turn / Step</span></button>
        <button class="concept" type="button" data-topic="Conversation History"><span class="concept-index">02</span><span>Conversation History</span></button>
        <button class="concept" type="button" data-topic="Tool Router"><span class="concept-index">03</span><span>Tool Router</span></button>
        <button class="concept" type="button" data-topic="Approval & Sandbox"><span class="concept-index">04</span><span>Approval & Sandbox</span></button>
        <button class="concept" type="button" data-topic="MCP & Plugins"><span class="concept-index">05</span><span>MCP & Plugins</span></button>
      </nav>

      <div class="sidebar-bottom">
        <p class="social-title">关注「虾哥不加班」</p>
        <div class="social-grid">
          <button class="social-card" type="button" data-qr="wechat">
            <img src="/wechat-official-qr.jpg" alt="微信公众号二维码缩略图">
            <strong>微信公众号</strong>
          </button>
          <button class="social-card douyin" type="button" data-qr="douyin">
            <img src="/douyin-qr-cropped.png" alt="抖音二维码缩略图">
            <strong>抖音</strong>
          </button>
        </div>
        <a class="repo-link" href="https://github.com/lobster-bujiaban/lob-codex" target="_blank" rel="noreferrer">github.com/lobster-bujiaban/lob-codex</a>
      </div>
    </aside>

    <section class="stage">
      <header class="topbar">
        <div class="page-title"><span>原理实验台 / 当前会话</span><strong id="page-topic">Session / Turn / Step</strong></div>
        <div class="topbar-actions">
          <button id="home-button" class="home-button" type="button">返回首页</button>
          <div class="status-pill"><span class="status-dot"></span>Responses API 已连接</div>
        </div>
      </header>

      <main class="conversation">
        <section id="messages" aria-live="polite">
          <div class="welcome">
            <img class="welcome-logo" src="/lobster-logo.png" alt="">
            <h1>不只看源码，把 Codex 跑明白</h1>
            <p>这是 LOB Codex 原理实验台。每一步都对应 Codex 源码中的真实模块、状态机和事件生命周期。</p>
            <div class="prompt-grid">
              <button class="prompt-chip" type="button" data-prompt="用通俗语言解释 Codex 的 Session、Turn 和 Step 分别负责什么？"><span>主链</span>解释 Session、Turn 和 Step</button>
              <button class="prompt-chip" type="button" data-prompt="为什么 Codex 的 StepContext 是内部快照，而不是公开事件？"><span>关键设计</span>为什么 Step 不是公开事件</button>
              <button class="prompt-chip" type="button" data-prompt="从 Submission 开始，描述一次 Codex 请求如何走到 TurnComplete。"><span>完整流程</span>从 Submission 到 TurnComplete</button>
            </div>
          </div>
        </section>
      </main>

      <div class="composer-dock">
        <div class="composer-wrap">
          <form id="chat-form">
            <textarea id="prompt" rows="1" placeholder="问一个关于 Codex Harness 的问题…" required></textarea>
            <button id="send" class="send-button" type="submit" aria-label="发送消息">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <div class="composer-meta"><span><strong>LOB Codex</strong> · Go 等价实现</span><span>Enter 发送 · Shift + Enter 换行</span></div>
        </div>
      </div>
    </section>
  </div>

  <dialog id="qr-dialog" class="qr-dialog">
    <div class="qr-dialog-inner">
      <button id="qr-dialog-close" class="qr-dialog-close" type="button" aria-label="关闭">×</button>
      <h2 id="qr-dialog-title"></h2>
      <p id="qr-dialog-description"></p>
      <img id="qr-dialog-image" src="" alt="">
    </div>
  </dialog>

  <script>
    const form = document.querySelector('#chat-form');
    const prompt = document.querySelector('#prompt');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    const welcomeTemplate = messages.querySelector('.welcome').cloneNode(true);
    const pageTopic = document.querySelector('#page-topic');
    const topicProfiles = {
      'Session / Turn / Step': {
        title: '不只看源码，把 Codex 跑明白',
        description: '从长生命周期 Session 到单次 Turn，再到内部 Step 快照，先看懂 Codex Harness 的调度骨架。',
        prompts: [
          ['主链', '解释 Session、Turn 和 Step', '用通俗语言解释 Codex 的 Session、Turn 和 Step 分别负责什么？'],
          ['关键设计', '为什么 Step 不是公开事件', '为什么 Codex 的 StepContext 是内部快照，而不是公开事件？'],
          ['完整流程', '从 Submission 到 TurnComplete', '从 Submission 开始，描述一次 Codex 请求如何走到 TurnComplete。']
        ]
      },
      'Conversation History': {
        title: '多轮对话，靠的不是字符串拼接',
        description: '理解 ResponseItem 如何进入会话历史，以及每个 Step 如何从同一事实序列构造模型输入。',
        prompts: [
          ['核心顺序', '输入何时写进 History', 'Codex 为什么在模型采样前，先把用户输入写入 Conversation History？'],
          ['请求快照', 'ForPrompt 做了什么', 'ConversationHistory.ForPrompt 为什么要返回快照？它和 Session 内的原始历史有什么区别？'],
          ['多轮上下文', '回答如何进入下一轮', '从 OutputItemDone 开始，解释助手回答如何回写 History 并成为下一轮上下文。']
        ]
      },
      'Tool Router': {
        title: '模型不会直接执行工具',
        description: '从模型输出 Tool Call，到路由、执行、结果回写和再次采样，拆开 Agent Tool Loop。',
        prompts: [
          ['运行演示', '调用 echo 跑一次 Tool Loop', '请调用 echo 工具回显“LOB Codex Tool Loop”，再根据工具结果告诉我完整调用流程。'],
          ['工作区读取', '用 exec_command 列出文件', '请使用 exec_command 的 rg --files 列出当前工作区文件，并概括项目结构。'],
          ['循环机制', '为什么需要再次采样', '工具执行结果写回 Conversation History 后，Codex 为什么还要启动下一次 Step？']
        ]
      },
      'Approval & Sandbox': {
        title: '能执行，不等于可以直接执行',
        description: '理解工具调用如何经过审批策略与沙箱边界，再安全地落到真实工作区。',
        prompts: [
          ['运行演示', '发起一次命令审批', '请执行审批演示，调用 exec_command 运行“pwd; echo approval-demo”，等待我批准或拒绝后再解释结果。'],
          ['隔离执行', 'Sandbox 保护了什么', 'Codex 的 Sandbox 在命令执行过程中主要限制哪些能力？'],
          ['失败语义', '拒绝后如何继续', '当用户拒绝审批或沙箱阻止命令时，结果如何反馈给模型继续推理？']
        ]
      },
      'MCP & Plugins': {
        title: '把外部能力接入同一条工具主链',
        description: 'MCP 和插件扩展工具来源，但仍复用 Codex 的注册、路由、审批与结果回传机制。',
        prompts: [
          ['能力发现', 'MCP 工具如何进入 Codex', 'Codex 如何连接 MCP Server 并把远程工具加入当前可用工具集合？'],
          ['动态更新', '工具列表如何刷新', '当 MCP 工具发生变化时，Codex 如何刷新工具而不破坏当前 Session？'],
          ['插件关系', 'Plugin、Skill 与 MCP 的区别', '用通俗语言解释 Codex 中 Plugin、Skill 和 MCP 分别解决什么问题。']
        ]
      }
    };
    let activeRequest;

    function createWelcome(topic) {
      const profile = topicProfiles[topic] || topicProfiles['Session / Turn / Step'];
      const welcome = welcomeTemplate.cloneNode(true);
      welcome.querySelector('h1').textContent = profile.title;
      welcome.querySelector('p').textContent = profile.description;
      welcome.querySelectorAll('.prompt-chip').forEach((button, index) => {
        const [label, title, question] = profile.prompts[index];
        const labelElement = document.createElement('span');
        labelElement.textContent = label;
        button.replaceChildren(labelElement, document.createTextNode(title));
        button.dataset.prompt = question;
      });
      return welcome;
    }

    function bindPromptChips(root = document) {
      root.querySelectorAll('.prompt-chip').forEach((button) => {
        button.addEventListener('click', () => submitPrompt(button.dataset.prompt));
      });
    }

    function showHome(topic = 'Session / Turn / Step') {
      activeRequest?.abort();
      activeRequest = undefined;
      messages.replaceChildren(createWelcome(topic));
      bindPromptChips(messages);
      prompt.value = '';
      prompt.style.height = '';
      send.disabled = false;
      pageTopic.textContent = topic;
      document.querySelectorAll('.concept').forEach((button) => {
        button.classList.toggle('active', button.dataset.topic === topic);
      });
      document.querySelector('.conversation').scrollTop = 0;
      prompt.focus();
    }

    function removeWelcome() {
      messages.querySelector('.welcome')?.remove();
    }

    function addMessage(role, text = '') {
      removeWelcome();
      const row = document.createElement('div');
      row.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (role === 'assistant') {
        const image = document.createElement('img');
        image.src = '/lobster-logo.png';
        image.alt = 'LOB Codex';
        avatar.append(image);
      } else {
        avatar.textContent = '你';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.append(avatar, bubble);
      messages.append(row);
      row.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return { row, bubble };
    }

    function addToolCall(toolCalls, event) {
      removeWelcome();
      const row = document.createElement('div');
      row.className = 'tool-call';
      const header = document.createElement('div');
      header.className = 'tool-call-header';
      const name = document.createElement('span');
      name.className = 'tool-call-name';
      name.textContent = `Tool · ${event.name}`;
      const status = document.createElement('span');
      status.className = 'tool-call-status';
      status.textContent = '执行中';
      const argumentsView = document.createElement('pre');
      argumentsView.textContent = event.arguments;
      header.append(name, status);
      row.append(header, argumentsView);
      messages.append(row);
      toolCalls.set(event.call_id, { row, status });
      row.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function completeToolCall(toolCalls, event) {
      const toolCall = toolCalls.get(event.call_id);
      if (!toolCall) return;
      toolCall.row.classList.add('completed');
      toolCall.status.textContent = '已完成';
      const output = document.createElement('div');
      output.className = 'tool-call-output';
      output.textContent = `输出：${event.output}`;
      toolCall.row.append(output);
    }

    function addApproval(event) {
      const card = document.createElement('div');
      card.className = 'approval-card';
      const title = document.createElement('h3');
      title.textContent = '需要批准执行命令';
      const reason = document.createElement('p');
      reason.textContent = `${event.reason || '该命令不在自动允许策略中'} · ${event.cwd}`;
      const command = document.createElement('pre');
      command.textContent = event.command.join(' ');
      const actions = document.createElement('div');
      actions.className = 'approval-actions';
      const approve = document.createElement('button');
      approve.className = 'approve';
      approve.type = 'button';
      approve.textContent = '批准一次';
      const deny = document.createElement('button');
      deny.type = 'button';
      deny.textContent = '拒绝';
      const result = document.createElement('div');
      result.className = 'approval-result';
      const respond = async (decision) => {
        approve.disabled = true;
        deny.disabled = true;
        result.textContent = '正在提交决定…';
        try {
          const response = await fetch(`/api/approvals/${encodeURIComponent(event.call_id)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ turn_id: event.turn_id, decision })
          });
          if (!response.ok) throw new Error((await response.text()) || `HTTP ${response.status}`);
          result.textContent = decision === 'approved' ? '已批准一次，命令继续执行' : '已拒绝，结果将返回模型';
        } catch (error) {
          approve.disabled = false;
          deny.disabled = false;
          result.textContent = `提交失败：${error.message}`;
        }
      };
      approve.addEventListener('click', () => respond('approved'));
      deny.addEventListener('click', () => respond('denied'));
      actions.append(approve, deny);
      card.append(title, reason, command, actions, result);
      messages.append(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function submitPrompt(text) {
      if (!text || send.disabled) return;
      const request = new AbortController();
      activeRequest = request;
      addMessage('user', text);
      let assistant;
      const toolCalls = new Map();
      prompt.value = '';
      prompt.style.height = '';
      send.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text }),
          signal: request.signal
        });
        if (!response.ok) throw new Error((await response.text()) || `HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const handleStreamEvent = (event) => {
          if (event.type === 'assistant_delta') {
            if (!assistant) {
              assistant = addMessage('assistant');
              assistant.bubble.classList.add('typing');
            }
            assistant.bubble.textContent += event.delta;
            assistant.row.scrollIntoView({ behavior: 'smooth', block: 'end' });
          } else if (event.type === 'tool_call_started') {
            addToolCall(toolCalls, event);
          } else if (event.type === 'tool_call_completed') {
            completeToolCall(toolCalls, event);
          } else if (event.type === 'exec_approval_request') {
            addApproval(event);
          } else if (event.type === 'error') {
            throw new Error(event.message);
          }
        };
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          lines.filter(Boolean).forEach((line) => handleStreamEvent(JSON.parse(line)));
        }
        buffer += decoder.decode();
        if (buffer.trim()) handleStreamEvent(JSON.parse(buffer));
      } catch (error) {
        if (error.name === 'AbortError') return;
        if (!assistant) assistant = addMessage('assistant');
        assistant.row.classList.add('error');
        assistant.bubble.textContent = error.message;
      } finally {
        assistant?.bubble.classList.remove('typing');
        send.disabled = false;
        if (activeRequest === request) activeRequest = undefined;
        prompt.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submitPrompt(prompt.value.trim());
    });

    prompt.addEventListener('input', () => {
      prompt.style.height = 'auto';
      prompt.style.height = `${Math.min(prompt.scrollHeight, 170)}px`;
    });

    prompt.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    bindPromptChips();
    document.querySelector('#home-brand').addEventListener('click', () => showHome());
    document.querySelector('#home-button').addEventListener('click', () => showHome());
    document.querySelectorAll('.concept').forEach((button) => {
      button.addEventListener('click', () => showHome(button.dataset.topic));
    });

    const qrDialog = document.querySelector('#qr-dialog');
    const qrTitle = document.querySelector('#qr-dialog-title');
    const qrDescription = document.querySelector('#qr-dialog-description');
    const qrImage = document.querySelector('#qr-dialog-image');
    const qrProfiles = {
      wechat: { title: '微信公众号 · 虾哥不加班', description: '微信扫码关注，持续更新 Agent Harness 源码拆解。', image: '/wechat-official-qr.jpg' },
      douyin: { title: '抖音 · 虾哥不加班', description: '抖音扫码关注，抖音号：lob.ai', image: '/douyin-qr-cropped.png' }
    };

    document.querySelectorAll('[data-qr]').forEach((button) => {
      button.addEventListener('click', () => {
        const profile = qrProfiles[button.dataset.qr];
        qrTitle.textContent = profile.title;
        qrDescription.textContent = profile.description;
        qrImage.src = profile.image;
        qrImage.alt = `${profile.title}二维码`;
        qrDialog.showModal();
      });
    });
    document.querySelector('#qr-dialog-close').addEventListener('click', () => qrDialog.close());
    qrDialog.addEventListener('click', (event) => {
      if (event.target === qrDialog) qrDialog.close();
    });
  </script>
</body>
</html>
