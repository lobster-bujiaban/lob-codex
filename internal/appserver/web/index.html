<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="LOB Codex - 用 Go 等价实现 Codex Harness">
  <title>LOB Codex · 用 Go 读懂 Codex</title>
  <style>
    :root {
      --paper: #fbfaf7;
      --canvas: #f3efe7;
      --surface: #ffffff;
      --surface-warm: #fff8ee;
      --ink: #172d4f;
      --ink-soft: #40536e;
      --muted: #7b8798;
      --line: #e6dfd4;
      --orange: #ed5a2a;
      --orange-dark: #c9421b;
      --orange-soft: #fff0e7;
      --navy: #17335e;
      --green: #24855b;
      --red: #c9463d;
      --shadow: 0 18px 50px rgba(37, 49, 67, .09);
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { overflow: hidden; background: var(--canvas); color: var(--ink); font: 14px/1.6 var(--font); }
    button, textarea { font: inherit; }
    button { color: inherit; }

    .app-shell { display: grid; grid-template-columns: 276px minmax(0, 1fr); height: 100vh; }
    .sidebar {
      display: flex; flex-direction: column; min-height: 0; padding: 24px 18px 18px;
      background: #f8f4ec; border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 5px 22px; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .brand-logo {
      width: 48px; height: 48px; object-fit: cover; border-radius: 15px;
      background: #fff; box-shadow: 0 6px 18px rgba(201, 66, 27, .12);
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 18px; letter-spacing: -.02em; }
    .brand-copy span { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: #eee9e0; }
    .mode-button { padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 650; cursor: pointer; }
    .mode-button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(37,49,67,.08); }
    .mode-button[data-mode="learning"].active { color: var(--orange-dark); }
    .is-hidden { display: none !important; }
    body[data-mode-view="work"] .thread-list { max-height: none; }

    .section-label { margin: 24px 7px 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    .concept-list { display: grid; gap: 5px; }
    .concept {
      display: flex; align-items: center; gap: 10px; padding: 10px 11px;
      width: 100%; border: 0; border-radius: 11px; background: transparent; color: var(--ink-soft); font-size: 12px;
      text-align: left; cursor: pointer;
    }
    .concept:hover { background: #f0ebe3; color: var(--ink); }
    .concept.active { background: #ebe5db; color: var(--ink); font-weight: 650; }
    .concept-index {
      display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 auto;
      border: 1px solid #d9d1c5; border-radius: 8px; background: #fff; color: var(--orange-dark);
      font: 700 10px/1 var(--font);
    }
    .concept.active .concept-index { border-color: var(--orange); background: var(--orange); color: #fff; }
    .thread-header { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .thread-header .section-label { margin: 0; }
    .new-thread { border: 0; background: transparent; color: var(--orange-dark); font-size: 11px; cursor: pointer; }
    .thread-list { display: grid; gap: 5px; margin-top: 8px; max-height: 180px; overflow-y: auto; }
    .thread-item { padding: 8px 10px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted); text-align: left; cursor: pointer; }
    .thread-item:hover, .thread-item.active { border-color: var(--line); background: #f0ebe3; color: var(--ink); }
    .thread-item strong, .thread-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-item strong { font-size: 11px; }.thread-item span { margin-top: 3px; font-size: 9px; color: var(--muted); }

    .sidebar-bottom { margin-top: auto; }
    .social-title { margin: 0 0 8px 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
    .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .social-card {
      display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; padding: 9px 6px;
      border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.72); cursor: pointer;
    }
    .social-card:hover { border-color: #efb99f; background: #fff; }
    .social-card img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; }
    .social-card.douyin img { object-position: 50% 39%; }
    .social-card strong { overflow: hidden; max-width: 100%; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .qr-dialog { width: min(420px, calc(100vw - 28px)); padding: 0; border: 0; border-radius: 20px; background: #fff; color: var(--ink); box-shadow: 0 24px 80px rgba(23,45,79,.25); }
    .qr-dialog::backdrop { background: rgba(23,45,79,.42); backdrop-filter: blur(3px); }
    .qr-dialog-inner { position: relative; padding: 24px; text-align: center; }
    .qr-dialog h2 { margin: 0; font-size: 18px; }
    .qr-dialog p { margin: 5px 0 16px; color: var(--muted); font-size: 12px; }
    .qr-dialog img { display: block; width: 100%; max-height: 570px; margin: 0 auto; border-radius: 13px; object-fit: contain; }
    .qr-dialog-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #f0ece5; cursor: pointer; }
    .workspace-dialog { width: min(600px, calc(100vw - 28px)); }
    .workspace-dialog form { display: block; padding: 26px; border: 0; border-radius: 0; box-shadow: none; }
    .workspace-dialog h2 { margin: 0; font-size: 19px; }.workspace-dialog p { margin: 7px 0 18px; color: var(--muted); font-size: 12px; }
    .workspace-field { display: flex; gap: 8px; }.workspace-field input { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .workspace-field button, .workspace-actions button { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); cursor: pointer; }
    .workspace-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }.workspace-actions .primary { border-color: var(--orange); background: var(--orange); color: #fff; }
    .workspace-error { min-height: 18px; margin-top: 8px; color: #b42318; font-size: 11px; }
    .repo-link { display: block; margin-top: 12px; color: var(--muted); font-size: 10px; text-align: center; text-decoration: none; }
    .repo-link:hover { color: var(--orange-dark); }

    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--paper); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; height: 72px;
      padding: 0 30px; border-bottom: 1px solid var(--line); background: rgba(251,250,247,.92);
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .home-button {
      padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--ink-soft); font-size: 11px; cursor: pointer;
    }
    .home-button:hover { border-color: #efb99f; color: var(--orange-dark); }
    .page-title span { display: block; color: var(--muted); font-size: 11px; }
    .page-title strong { display: block; margin-top: 1px; font-size: 15px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px;
      border: 1px solid #cfe5d8; border-radius: 999px; background: #f3fbf6; color: var(--green); font-size: 11px; font-weight: 650;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(36,133,91,.1); }

    .conversation { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
    #messages {
      display: flex; flex-direction: column; gap: 22px; width: min(820px, calc(100% - 56px));
      min-height: 100%; margin: 0 auto; padding: 38px 0 190px;
    }
    .welcome { display: grid; justify-items: center; margin: auto 0; padding: 35px 0 70px; text-align: center; }
    .welcome-logo { width: 128px; height: 128px; object-fit: cover; border-radius: 34px; background: #fff; box-shadow: var(--shadow); }
    .welcome h1 { margin: 20px 0 5px; font-size: 25px; letter-spacing: -.03em; }
    .welcome > p { max-width: 470px; margin: 0; color: var(--muted); font-size: 13px; }
    .prompt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: min(680px, 100%); margin-top: 27px; }
    .prompt-chip {
      min-height: 76px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 14px;
      background: #fff; color: var(--ink-soft); text-align: left; cursor: pointer; transition: .18s ease;
    }
    .prompt-chip:hover { transform: translateY(-2px); border-color: #efb99f; box-shadow: 0 10px 24px rgba(54, 63, 74, .08); }
    .prompt-chip span { display: block; margin-bottom: 3px; color: var(--orange-dark); font-size: 10px; font-weight: 750; letter-spacing: .08em; }

    .message { display: flex; gap: 11px; max-width: 84%; animation: enter .22s ease both; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }
    .avatar {
      display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto;
      border-radius: 11px; overflow: hidden; background: var(--navy); color: #fff; font-size: 11px; font-weight: 750;
    }
    .assistant .avatar { border: 1px solid #f0d9ca; background: var(--orange-soft); }
    .assistant .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .bubble { padding: 12px 15px; border-radius: 5px 17px 17px 17px; white-space: pre-wrap; word-break: break-word; line-height: 1.75; }
    .assistant .bubble { border: 1px solid var(--line); background: #fff; box-shadow: 0 7px 22px rgba(37,49,67,.045); }
    .message-content { min-width: 0; }
    .message-actions { display: flex; margin-top: 5px; }
    .copy-message { padding: 2px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
    .copy-message:hover { background: #eeeae3; color: var(--ink-soft); }
    .user .bubble { border-radius: 17px 5px 17px 17px; background: var(--navy); color: #fff; }
    .message.error .bubble { border-color: #efc0bc; background: #fff5f4; color: var(--red); }
    .tool-call {
      align-self: flex-start; width: min(620px, 88%); padding: 13px 15px;
      border: 1px solid #d8d2ef; border-radius: 14px; background: #faf9ff; color: var(--ink-soft);
      animation: enter .22s ease both;
    }
    .tool-call-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tool-call-name { color: #5b4ba8; font-size: 12px; font-weight: 750; }
    .tool-call-status { color: var(--muted); font-size: 10px; }
    .tool-call.completed .tool-call-status { color: var(--green); }
    .tool-call pre { overflow-x: auto; margin: 8px 0 0; color: #53627a; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .tool-call-output { margin-top: 9px; padding-top: 9px; border-top: 1px solid #e4e0f2; font-size: 12px; }
    .approval-card { align-self: flex-start; width: min(620px, 90%); padding: 16px; border: 1px solid #efb99f; border-radius: 16px; background: #fff8ee; animation: enter .22s ease both; }
    .approval-card h3 { margin: 0; color: var(--orange-dark); font-size: 14px; }
    .approval-card p { margin: 5px 0 10px; color: var(--muted); font-size: 11px; }
    .approval-card pre { overflow-x: auto; margin: 0; padding: 10px; border-radius: 10px; background: #172d4f; color: #fff; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .approval-actions { display: flex; gap: 8px; margin-top: 12px; }
    .approval-actions button { padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
    .approval-actions .approve { border-color: var(--orange); background: var(--orange); color: #fff; }
    .approval-actions button:disabled { opacity: .55; cursor: default; }
    .approval-result { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .typing::after { content: ""; display: inline-block; width: 5px; height: 14px; margin-left: 4px; background: var(--orange); vertical-align: -2px; animation: blink .7s infinite alternate; }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } }
    @keyframes blink { to { opacity: .15; } }

    .composer-dock {
      position: absolute; right: 0; bottom: 0; left: 276px; padding: 44px 24px 16px;
      background: linear-gradient(transparent, var(--paper) 35%);
    }
    .composer-wrap { width: min(840px, 100%); margin: 0 auto; }
    form {
      display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 16px;
      border: 1px solid #dcd4c8; border-radius: 20px; background: #fff; box-shadow: var(--shadow);
    }
    .input-stack { min-width: 0; flex: 1; }
    .image-previews { display: flex; flex-wrap: wrap; gap: 8px; }
    .image-previews:empty { display: none; }
    .image-preview { position: relative; width: 68px; height: 68px; margin-bottom: 5px; }
    .image-preview img { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 11px; object-fit: cover; }
    .image-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0; border: 2px solid #fff; border-radius: 50%; background: var(--ink); color: #fff; font: 14px/16px var(--font); cursor: pointer; }
    .attach-button { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto; margin-bottom: 2px; border: 0; border-radius: 11px; background: #f2eee7; color: var(--ink-soft); cursor: pointer; }
    .attach-button:hover { background: var(--orange-soft); color: var(--orange-dark); }
    .attach-button svg { width: 19px; height: 19px; }
    textarea {
      flex: 1; min-height: 44px; max-height: 170px; resize: none; padding: 10px 0 7px;
      border: 0; outline: 0; background: transparent; color: var(--ink); line-height: 1.55;
    }
    textarea::placeholder { color: #a4abb5; }
    .send-button {
      display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto;
      border: 0; border-radius: 13px; background: var(--orange); color: #fff; cursor: pointer;
      box-shadow: 0 7px 16px rgba(237,90,42,.24); transition: .18s ease;
    }
    .send-button:hover { background: var(--orange-dark); transform: translateY(-1px); }
    .send-button:disabled { opacity: .48; cursor: wait; transform: none; }
    .send-button svg { width: 19px; height: 19px; }
    .composer-meta { display: flex; justify-content: space-between; padding: 7px 5px 0; color: var(--muted); font-size: 10px; }
    .composer-meta strong { color: var(--orange-dark); font-weight: 650; }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .composer-dock { left: 0; }
      .topbar { padding: 0 18px; }
      #messages { width: calc(100% - 28px); padding-top: 25px; }
      .prompt-grid { grid-template-columns: 1fr; }
      .welcome { padding-top: 10px; }
      .message { max-width: 94%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="项目导航">
      <button id="home-brand" class="brand" type="button" aria-label="返回首页">
        <img class="brand-logo" src="/lobster-logo.png" alt="虾哥不加班 Logo">
        <div class="brand-copy"><strong>LOB Codex</strong><span>用 Go 读懂 Codex Harness</span></div>
      </button>

      <div class="mode-switch" role="tablist" aria-label="使用模式">
        <button class="mode-button active" type="button" data-mode="work" role="tab" aria-selected="true">工作模式</button>
        <button class="mode-button" type="button" data-mode="learning" role="tab" aria-selected="false">学习模式</button>
      </div>

      <div class="thread-header work-only"><p class="section-label">对话工作区</p><button id="new-thread" class="new-thread" type="button">＋ 新建</button></div>
      <div id="thread-list" class="thread-list work-only"></div>

      <p class="section-label learning-only is-hidden">当前学习主链</p>
      <nav class="concept-list learning-only is-hidden">
        <button class="concept active" type="button" data-topic="Session / Turn / Step"><span class="concept-index">01</span><span>Session / Turn / Step</span></button>
        <button class="concept" type="button" data-topic="Conversation History"><span class="concept-index">02</span><span>Conversation History</span></button>
        <button class="concept" type="button" data-topic="Tool Router"><span class="concept-index">03</span><span>Tool Router</span></button>
        <button class="concept" type="button" data-topic="Approval & Sandbox"><span class="concept-index">04</span><span>Approval & Sandbox</span></button>
        <button class="concept" type="button" data-topic="MCP & Plugins"><span class="concept-index">05</span><span>MCP & Plugins</span></button>
      </nav>

      <div class="sidebar-bottom learning-only is-hidden">
        <p class="social-title">关注「虾哥不加班」</p>
        <div class="social-grid">
          <button class="social-card" type="button" data-qr="wechat">
            <img src="/wechat-official-qr.jpg" alt="微信公众号二维码缩略图">
            <strong>微信公众号</strong>
          </button>
          <button class="social-card douyin" type="button" data-qr="douyin">
            <img src="/douyin-qr-cropped.png" alt="抖音二维码缩略图">
            <strong>抖音</strong>
          </button>
        </div>
        <a class="repo-link" href="https://github.com/lobster-bujiaban/lob-codex" target="_blank" rel="noreferrer">github.com/lobster-bujiaban/lob-codex</a>
      </div>
    </aside>

    <section class="stage">
      <header class="topbar">
        <div class="page-title"><span id="workspace-path">原理实验台 / 当前工作区</span><strong id="page-topic">Session / Turn / Step</strong></div>
        <div class="topbar-actions">
          <button id="home-button" class="home-button" type="button">返回首页</button>
          <div class="status-pill"><span class="status-dot"></span>Responses API 已连接</div>
        </div>
      </header>

      <main class="conversation">
        <section id="messages" aria-live="polite">
          <div class="welcome">
            <img class="welcome-logo" src="/lobster-logo.png" alt="">
            <h1>不只看源码，把 Codex 跑明白</h1>
            <p>这是 LOB Codex 原理实验台。每一步都对应 Codex 源码中的真实模块、状态机和事件生命周期。</p>
            <div class="prompt-grid">
              <button class="prompt-chip" type="button" data-prompt="用通俗语言解释 Codex 的 Session、Turn 和 Step 分别负责什么？"><span>主链</span>解释 Session、Turn 和 Step</button>
              <button class="prompt-chip" type="button" data-prompt="为什么 Codex 的 StepContext 是内部快照，而不是公开事件？"><span>关键设计</span>为什么 Step 不是公开事件</button>
              <button class="prompt-chip" type="button" data-prompt="从 Submission 开始，描述一次 Codex 请求如何走到 TurnComplete。"><span>完整流程</span>从 Submission 到 TurnComplete</button>
            </div>
          </div>
        </section>
      </main>

      <div class="composer-dock">
        <div class="composer-wrap">
          <form id="chat-form">
            <input id="image-picker" type="file" accept="image/*" multiple hidden>
            <button id="attach-image" class="attach-button" type="button" aria-label="添加图片" title="添加或粘贴图片">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="input-stack">
              <div id="image-previews" class="image-previews" aria-live="polite"></div>
              <textarea id="prompt" rows="1" placeholder="问一个关于 Codex Harness 的问题…"></textarea>
            </div>
            <button id="send" class="send-button" type="submit" aria-label="发送消息">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <div class="composer-meta"><span><strong>LOB Codex</strong> · Go 等价实现</span><span>Enter 发送 · Shift + Enter 换行</span></div>
        </div>
      </div>
    </section>
  </div>

  <dialog id="qr-dialog" class="qr-dialog">
    <div class="qr-dialog-inner">
      <button id="qr-dialog-close" class="qr-dialog-close" type="button" aria-label="关闭">×</button>
      <h2 id="qr-dialog-title"></h2>
      <p id="qr-dialog-description"></p>
      <img id="qr-dialog-image" src="" alt="">
    </div>
  </dialog>

  <dialog id="workspace-dialog" class="qr-dialog workspace-dialog">
    <form id="workspace-form">
      <h2>新建工作区对话</h2>
      <p>选择一个本地文件夹，新的 Thread、Session 和工具调用都会绑定到该工作区。</p>
      <div class="workspace-field">
        <input id="workspace-input" type="text" aria-label="工作区绝对路径" placeholder="/Users/name/project" required>
        <button id="workspace-browse" type="button">选择文件夹</button>
      </div>
      <div id="workspace-error" class="workspace-error"></div>
      <div class="workspace-actions">
        <button id="workspace-cancel" type="button">取消</button>
        <button class="primary" type="submit">创建对话</button>
      </div>
    </form>
  </dialog>

  <script>
    const form = document.querySelector('#chat-form');
    const prompt = document.querySelector('#prompt');
    const send = document.querySelector('#send');

        prompts: [
          ['运行演示', '发起一次命令审批', '请执行审批演示，调用 exec_command 运行“pwd; echo approval-demo”，等待我批准或拒绝后再解释结果。'],
          ['PTY 终端', '运行交互式 PTY 演示', '请运行 PTY 演示，通过 tty 模式启动交互命令，再用 write_stdin 输入内容直到完成。'],
          ['会话规则', '演示本会话批准缓存', '请运行会话规则演示，调用 exec_command 执行 go version，并让我选择本会话批准。']
        ]
      },
      'MCP & Plugins': {
        title: '把外部能力接入同一条工具主链',
        description: 'MCP 和插件扩展工具来源，但仍复用 Codex 的注册、路由、审批与结果回传机制。',
        prompts: [
          ['能力发现', 'MCP 工具如何进入 Codex', 'Codex 如何连接 MCP Server 并把远程工具加入当前可用工具集合？'],
          ['动态更新', '工具列表如何刷新', '当 MCP 工具发生变化时，Codex 如何刷新工具而不破坏当前 Session？'],
          ['插件关系', 'Plugin、Skill 与 MCP 的区别', '用通俗语言解释 Codex 中 Plugin、Skill 和 MCP 分别解决什么问题。']
        ]
      }
    };
    let activeRequest;

    const workProfile = {
      title: '准备好一起完成工作',
      description: '选择一个工作区，直接让 LOB Codex 阅读代码、修改文件或执行命令。',
      prompts: [
        ['了解项目', '分析当前项目结构', '请分析当前项目结构，并告诉我最值得先关注的模块。'],
        ['继续开发', '找出下一步任务', '请结合当前代码和文档，判断下一步最应该实现什么。'],
        ['检查改动', '查看工作区状态', '请检查当前工作区改动，并指出需要关注的问题。']
      ]
    };

    function createWelcome(topic) {
      const profile = activeMode === 'work'
        ? workProfile
        : (topicProfiles[topic] || topicProfiles['Session / Turn / Step']);
      const welcome = welcomeTemplate.cloneNode(true);
      welcome.querySelector('h1').textContent = profile.title;
      welcome.querySelector('p').textContent = profile.description;
      welcome.querySelectorAll('.prompt-chip').forEach((button, index) => {
        const [label, title, question] = profile.prompts[index];
        const labelElement = document.createElement('span');
        labelElement.textContent = label;
        button.replaceChildren(labelElement, document.createTextNode(title));
        button.dataset.prompt = question;
      });
      return welcome;
    }

    function bindPromptChips(root = document) {
      root.querySelectorAll('.prompt-chip').forEach((button) => {
        button.addEventListener('click', () => submitPrompt(button.dataset.prompt));
      });
    }

    function showHome(topic = 'Session / Turn / Step') {
      activeRequest?.abort();
      activeRequest = undefined;
      messages.replaceChildren(createWelcome(topic));
      bindPromptChips(messages);
      prompt.value = '';
      pendingImages = [];
      renderImagePreviews();
      prompt.style.height = '';
      send.disabled = false;
      pageTopic.textContent = activeMode === 'work' ? '工作模式' : topic;
      document.querySelectorAll('.concept').forEach((button) => {
        button.classList.toggle('active', button.dataset.topic === topic);
      });
      document.querySelector('.conversation').scrollTop = 0;
      prompt.focus();
    }

    function setMode(mode) {
      if (mode !== 'work' && mode !== 'learning') return;
      activeMode = mode;
      document.body.dataset.modeView = mode;
      document.querySelectorAll('.mode-button').forEach((button) => {
        const active = button.dataset.mode === mode;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', String(active));
      });
      document.querySelectorAll('.learning-only').forEach((element) => {
        element.classList.toggle('is-hidden', mode !== 'learning');
      });
      document.querySelectorAll('.work-only').forEach((element) => {
        element.classList.toggle('is-hidden', mode !== 'work');
      });
      homeButton.textContent = mode === 'learning' ? '返回学习首页' : '清空对话视图';
      prompt.placeholder = mode === 'learning'
        ? '问一个关于 Codex Harness 的问题…'
        : '描述你想在当前工作区完成的任务…';
      renderThreads();
      showHome();
    }

    function renderThreads() {
      threadList.replaceChildren();
      threads.forEach((thread) => {
        const button = document.createElement('button');
        button.className = `thread-item${thread.id === activeThreadID ? ' active' : ''}`;
        button.type = 'button';
        const name = document.createElement('strong');
        name.textContent = thread.workspace_root.split('/').filter(Boolean).pop() || thread.workspace_root;
        const path = document.createElement('span');
        path.textContent = thread.workspace_root;
        button.append(name, path);
        button.addEventListener('click', () => selectThread(thread.id));
        threadList.append(button);
      });
      const active = threads.find((thread) => thread.id === activeThreadID);
      workspacePath.textContent = activeMode === 'learning'
        ? '学习模式 / Codex Harness'
        : (active ? `工作区 / ${active.workspace_root}` : '工作区缺失');
    }

    async function selectThread(threadID) {
      activeRequest?.abort();
      activeThreadID = threadID;
      renderThreads();
      showHome();
      try {
        const response = await fetch(`/api/threads/${encodeURIComponent(threadID)}/history`);
        if (!response.ok) throw new Error(await response.text());
        if (activeThreadID !== threadID) return;
        renderHistory((await response.json()).items || []);
      } catch (error) {
        if (activeThreadID !== threadID) return;
        const message = addMessage('assistant');
        message.row.classList.add('error');
        message.bubble.textContent = `恢复历史失败：${error.message}`;
      }
    }

    async function loadThreads() {
      const response = await fetch('/api/threads');
      if (!response.ok) throw new Error(await response.text());
      threads = (await response.json()).threads;
      if (!threads.some((thread) => thread.id === activeThreadID)) activeThreadID = threads[0]?.id;
      renderThreads();
    }

    function createThread() {
      const current = threads.find((thread) => thread.id === activeThreadID);
      workspaceInput.value = current?.workspace_root || '';
      workspaceError.textContent = '';
      workspaceDialog.showModal();
      workspaceInput.focus();
      workspaceInput.select();
    }

    async function submitThread(workspaceRoot) {
      const response = await fetch('/api/threads', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ workspace_root: workspaceRoot })
      });
      if (!response.ok) {
        workspaceError.textContent = (await response.text()) || `HTTP ${response.status}`;
        return;
      }
      const thread = await response.json();
      threads.unshift(thread);
      workspaceDialog.close();
      selectThread(thread.id);
    }

    async function browseWorkspace() {
      workspaceError.textContent = '正在打开文件夹选择器…';
      const response = await fetch('/api/workspaces/select', { method: 'POST' });
      if (response.status === 204) {
        workspaceError.textContent = '';
        return;
      }
      if (!response.ok) {
        workspaceError.textContent = (await response.text()) || `HTTP ${response.status}`;
        return;
      }
      workspaceInput.value = (await response.json()).workspace_root;
      workspaceError.textContent = '';
    }

    function removeWelcome() {
      messages.querySelector('.welcome')?.remove();
    }

    function addMessage(role, text = '') {
      removeWelcome();
      const row = document.createElement('div');
      row.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (role === 'assistant') {
        const image = document.createElement('img');
        image.src = '/lobster-logo.png';
        image.alt = 'LOB Codex';
        avatar.append(image);
      } else {
        avatar.textContent = '你';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const content = document.createElement('div');
      content.className = 'message-content';
      content.append(bubble);
      if (role === 'assistant') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        const copy = document.createElement('button');
        copy.className = 'copy-message';
        copy.type = 'button';
        copy.textContent = '复制';
        copy.addEventListener('click', async () => {
          await navigator.clipboard.writeText(bubble.innerText);
          copy.textContent = '已复制';
          setTimeout(() => { copy.textContent = '复制'; }, 1200);
        });
        actions.append(copy);
        content.append(actions);
      }
      row.append(avatar, content);
      messages.append(row);
      row.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return { row, bubble };
    }

    function renderImagePreviews() {
      imagePreviews.replaceChildren();
      pendingImages.forEach((imageURL, index) => {
        const preview = document.createElement('div');
        preview.className = 'image-preview';
        const image = document.createElement('img');
        image.src = imageURL;
        image.alt = `待发送图片 ${index + 1}`;
        const remove = document.createElement('button');
        remove.className = 'image-remove';
        remove.type = 'button';
        remove.setAttribute('aria-label', `移除图片 ${index + 1}`);
        remove.textContent = '×';
        remove.addEventListener('click', () => {
          pendingImages.splice(index, 1);
          renderImagePreviews();
        });
        preview.append(image, remove);
        imagePreviews.append(preview);
      });
    }

    function readImageFiles(files) {
      const available = Math.max(0, 4 - pendingImages.length);
      [...files].filter((file) => file.type.startsWith('image/')).slice(0, available).forEach((file) => {
        if (file.size > 8 * 1024 * 1024) return;
        const reader = new FileReader();
        reader.addEventListener('load', () => {
          pendingImages.push(reader.result);
          renderImagePreviews();
        });
        reader.readAsDataURL(file);
      });
    }

    function renderHistory(items) {
      if (!items.length) return;
      messages.replaceChildren();
      const toolCalls = new Map();
      items.forEach((item) => {
        if (item.type === 'message' && (item.role === 'user' || item.role === 'assistant')) {
          const text = (item.content || []).map((content) => content.text || '').join('');
          const message = addMessage(item.role, text);
          (item.content || []).filter((content) => content.type === 'input_image').forEach((content) => {
            const image = document.createElement('img');
            image.src = content.image_url;
            image.alt = '历史消息图片';
            image.style.cssText = 'display:block;max-width:280px;max-height:240px;margin-top:8px;border-radius:10px;object-fit:contain';
            message.bubble.append(image);
          });
        } else if (item.type === 'function_call') {
          addToolCall(toolCalls, {
            call_id: item.call_id, name: item.name, arguments: item.arguments
          });
        } else if (item.type === 'function_call_output') {
          completeToolCall(toolCalls, {
            call_id: item.call_id, output: item.output
          });
        }
      });
      document.querySelector('.conversation').scrollTop = document.querySelector('.conversation').scrollHeight;
    }

    function addToolCall(toolCalls, event) {
      removeWelcome();
      const row = document.createElement('div');
      row.className = 'tool-call';
      const header = document.createElement('div');
      header.className = 'tool-call-header';
      const name = document.createElement('span');
      name.className = 'tool-call-name';
      name.textContent = `Tool · ${event.name}`;
      const status = document.createElement('span');
      status.className = 'tool-call-status';
      status.textContent = '执行中';
      const argumentsView = document.createElement('pre');
      argumentsView.textContent = event.arguments;
      header.append(name, status);
      row.append(header, argumentsView);
      messages.append(row);
      toolCalls.set(event.call_id, { row, status, liveOutput: null });
      row.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function appendExecDelta(toolCalls, event) {
      const toolCall = toolCalls.get(event.call_id);
      if (!toolCall) return;
      if (!toolCall.liveOutput) {
        toolCall.liveOutput = document.createElement('div');
        toolCall.liveOutput.className = 'tool-call-output';
        toolCall.liveOutput.textContent = '实时输出：\n';
        toolCall.row.append(toolCall.liveOutput);
      }
      const bytes = Uint8Array.from(atob(event.chunk), (character) => character.charCodeAt(0));
      const text = new TextDecoder().decode(bytes);
      toolCall.liveOutput.textContent += `[${event.stream}] ${text}`;
      toolCall.row.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function addTerminalInteraction(toolCalls, event) {
      const toolCall = toolCalls.get(event.call_id);
      if (!toolCall) return;
      const interaction = document.createElement('div');
      interaction.className = 'tool-call-output';
      interaction.textContent = event.stdin
        ? `终端输入 · Session ${event.process_id}：${JSON.stringify(event.stdin)}`
        : `终端轮询 · Session ${event.process_id}`;
      toolCall.row.append(interaction);
    }

    function completeToolCall(toolCalls, event) {
      const toolCall = toolCalls.get(event.call_id);
      if (!toolCall) return;
      let parsedOutput;
      try { parsedOutput = JSON.parse(event.output); } catch (_) {}
      if (parsedOutput?.session_id) {
        toolCall.status.textContent = `仍在运行 · Session ${parsedOutput.session_id}`;
      } else {
        toolCall.row.classList.add('completed');
        toolCall.status.textContent = '已完成';
      }
      const output = document.createElement('div');
      output.className = 'tool-call-output';
      if (parsedOutput) {
        const state = parsedOutput.session_id
          ? `Session ID：${parsedOutput.session_id}`
          : `退出码：${parsedOutput.exit_code}`;
        const terminal = parsedOutput.tty ? ' · TTY' : '';
        const policy = parsedOutput.policy_rule ? `\n策略：${parsedOutput.policy_rule}` : '';
        const collection = parsedOutput.original_token_count !== undefined
          ? `\n原始 Token 估算：${parsedOutput.original_token_count}${parsedOutput.output_omitted_bytes ? ` · 省略 ${parsedOutput.output_omitted_bytes} 字节` : ''}`
          : '';
        output.textContent = `${state}${terminal}${policy}${collection}${parsedOutput.output ? `\n输出：${parsedOutput.output}` : ''}`;
      } else {
        output.textContent = `输出：${event.output}`;
      }
      toolCall.row.append(output);
    }

    function addApproval(event, threadID) {
      const card = document.createElement('div');
      card.className = 'approval-card';
      const title = document.createElement('h3');
      title.textContent = '需要批准执行命令';
      const reason = document.createElement('p');
      reason.textContent = `${event.reason || '该命令不在自动允许策略中'} · ${event.cwd}`;
      const command = document.createElement('pre');
      command.textContent = event.command.join(' ');
      const actions = document.createElement('div');
      actions.className = 'approval-actions';
      const approve = document.createElement('button');
      approve.className = 'approve';
      approve.type = 'button';
      approve.textContent = '批准一次';
      const deny = document.createElement('button');
      deny.type = 'button';
      deny.textContent = '拒绝';
      const approveSession = document.createElement('button');
      approveSession.type = 'button';
      approveSession.textContent = '本会话批准';
      const approveAlways = document.createElement('button');
      approveAlways.type = 'button';
      approveAlways.textContent = '始终允许';
      const result = document.createElement('div');
      result.className = 'approval-result';
      const respond = async (decision) => {
        approve.disabled = true;
        deny.disabled = true;
        approveSession.disabled = true;
        approveAlways.disabled = true;
        result.textContent = '正在提交决定…';
        try {
          const response = await fetch(`/api/approvals/${encodeURIComponent(event.call_id)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ turn_id: event.turn_id, thread_id: threadID, decision })
          });
          if (!response.ok) throw new Error((await response.text()) || `HTTP ${response.status}`);
          if (decision === 'approved') result.textContent = '已批准一次，命令继续执行';
          else if (decision === 'approved_for_session') result.textContent = '已批准本会话规则，后续匹配命令将自动执行';
          else if (decision === 'approved_with_amendment') result.textContent = '规则已保存到项目 tmp，重启后仍会自动执行';
          else result.textContent = '已拒绝，结果将返回模型';
        } catch (error) {
          approve.disabled = false;
          deny.disabled = false;
          approveSession.disabled = false;
          approveAlways.disabled = false;
          result.textContent = `提交失败：${error.message}`;
        }
      };
      approve.addEventListener('click', () => respond('approved'));
      approveSession.addEventListener('click', () => respond('approved_for_session'));
      approveAlways.addEventListener('click', () => respond('approved_with_amendment'));
      deny.addEventListener('click', () => respond('denied'));
      actions.append(approve);
      if (event.proposed_prefix_rule?.length) {
        const prefix = document.createElement('div');
        prefix.className = 'approval-result';
        prefix.textContent = `建议规则：[${event.proposed_prefix_rule.join(', ')}]`;
        card.append(title, reason, command, prefix, actions, result);
        actions.append(approveSession, approveAlways, deny);
      } else {
        actions.append(deny);
        card.append(title, reason, command, actions, result);
      }
      messages.append(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function submitPrompt(text) {
      if ((!text && !pendingImages.length) || send.disabled) return;
      const request = new AbortController();
      const requestThreadID = activeThreadID;
      const requestImages = pendingImages.slice();
      activeRequest = request;
      const userMessage = addMessage('user', text);
      requestImages.forEach((imageURL) => {
        const image = document.createElement('img');
        image.src = imageURL;
        image.alt = '已发送图片';
        image.style.cssText = 'display:block;max-width:280px;max-height:240px;margin-top:8px;border-radius:10px;object-fit:contain';
        userMessage.bubble.append(image);
      });
      let assistant;
      const toolCalls = new Map();
      prompt.value = '';
      pendingImages = [];
      renderImagePreviews();
      prompt.style.height = '';
      send.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, thread_id: requestThreadID, image_urls: requestImages }),
          signal: request.signal
        });
        if (!response.ok) throw new Error((await response.text()) || `HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const handleStreamEvent = (event) => {
          if (event.type === 'assistant_delta') {
            if (!assistant) {
              assistant = addMessage('assistant');
              assistant.bubble.classList.add('typing');
            }
            assistant.bubble.textContent += event.delta;
            assistant.row.scrollIntoView({ behavior: 'smooth', block: 'end' });
          } else if (event.type === 'tool_call_started') {
            addToolCall(toolCalls, event);
          } else if (event.type === 'tool_call_completed') {
            completeToolCall(toolCalls, event);
          } else if (event.type === 'exec_command_output_delta') {
            appendExecDelta(toolCalls, event);
          } else if (event.type === 'terminal_interaction') {
            addTerminalInteraction(toolCalls, event);
          } else if (event.type === 'exec_approval_request') {
            addApproval(event, requestThreadID);
          } else if (event.type === 'error') {
            throw new Error(event.message);
          }
        };
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          lines.filter(Boolean).forEach((line) => handleStreamEvent(JSON.parse(line)));
        }
        buffer += decoder.decode();
        if (buffer.trim()) handleStreamEvent(JSON.parse(buffer));
      } catch (error) {
        if (error.name === 'AbortError') return;
        if (!assistant) assistant = addMessage('assistant');
        assistant.row.classList.add('error');
        assistant.bubble.textContent = error.message;
      } finally {
        assistant?.bubble.classList.remove('typing');
        send.disabled = false;
        if (activeRequest === request) activeRequest = undefined;
        prompt.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submitPrompt(prompt.value.trim());
    });
    document.querySelector('#attach-image').addEventListener('click', () => imagePicker.click());
    imagePicker.addEventListener('change', () => {
      readImageFiles(imagePicker.files);
      imagePicker.value = '';
    });
    prompt.addEventListener('paste', (event) => {
      const imageFiles = [...event.clipboardData.items]
        .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (imageFiles.length) {
        event.preventDefault();
        readImageFiles(imageFiles);
      }
    });

    prompt.addEventListener('input', () => {
      prompt.style.height = 'auto';
      prompt.style.height = `${Math.min(prompt.scrollHeight, 170)}px`;
    });

    prompt.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    bindPromptChips();
    document.querySelectorAll('.mode-button').forEach((button) => {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    });
    document.querySelector('#home-brand').addEventListener('click', () => showHome());
    document.querySelector('#home-button').addEventListener('click', () => showHome());
    document.querySelector('#new-thread').addEventListener('click', createThread);
    document.querySelector('#workspace-browse').addEventListener('click', browseWorkspace);
    document.querySelector('#workspace-cancel').addEventListener('click', () => workspaceDialog.close());
    workspaceForm.addEventListener('submit', (event) => {
      event.preventDefault();
      submitThread(workspaceInput.value.trim());
    });
    document.querySelectorAll('.concept').forEach((button) => {
      button.addEventListener('click', () => showHome(button.dataset.topic));
    });

    const qrDialog = document.querySelector('#qr-dialog');
    const qrTitle = document.querySelector('#qr-dialog-title');
    const qrDescription = document.querySelector('#qr-dialog-description');
    const qrImage = document.querySelector('#qr-dialog-image');
    const qrProfiles = {
      wechat: { title: '微信公众号 · 虾哥不加班', description: '微信扫码关注，持续更新 Agent Harness 源码拆解。', image: '/wechat-official-qr.jpg' },
      douyin: { title: '抖音 · 虾哥不加班', description: '抖音扫码关注，抖音号：lob.ai', image: '/douyin-qr-cropped.png' }
    };

    document.querySelectorAll('[data-qr]').forEach((button) => {
      button.addEventListener('click', () => {
        const profile = qrProfiles[button.dataset.qr];
        qrTitle.textContent = profile.title;
        qrDescription.textContent = profile.description;
        qrImage.src = profile.image;
        qrImage.alt = `${profile.title}二维码`;
        qrDialog.showModal();
      });
    });
    document.querySelector('#qr-dialog-close').addEventListener('click', () => qrDialog.close());
    qrDialog.addEventListener('click', (event) => {
      if (event.target === qrDialog) qrDialog.close();
    });
    setMode('work');
    loadThreads().catch((error) => { workspacePath.textContent = `工作区加载失败：${error.message}`; });
  </script>
</body>
</html>
