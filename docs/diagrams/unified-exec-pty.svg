<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102747"/><stop offset="1" stop-color="#08172d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity=".36"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f9733d"/></marker>
    <style>.title{font:700 36px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#9aabc1}.lane{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#dbeafe}.nt{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.tx{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#b8c5d8}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}.nh{font:700 17px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#172d4f}.note{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#40536e}</style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><circle cx="1300" cy="80" r="190" fill="#f9733d" opacity=".07"/><circle cx="80" cy="830" r="230" fill="#38bdf8" opacity=".05"/>
  <text x="70" y="72" class="title">exec_command tty:true → PTY ProcessHandle</text><text x="70" y="105" class="sub">平台适配不同，Codex 生命周期不变：同一 store、session_id、增量输出与 write_stdin</text>
  <g transform="translate(70 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">exec_command</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="120" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">tty: true</text><text x="18" y="70" class="tx">审批与 Seatbelt 保持不变</text><text x="18" y="96" class="mono">rows:24 · cols:120</text></g>
    <g transform="translate(24 245)" filter="url(#s)"><rect width="302" height="145" rx="18" fill="#1b3a63" stroke="#a78bfa"/><text x="18" y="36" class="nt">creack/pty</text><text x="18" y="70" class="tx">创建主端/从端</text><text x="18" y="96" class="tx">子进程成为终端前台进程</text><text x="18" y="122" class="tx">主端保存进 Process Store</text></g>
  </g>
  <g transform="translate(500 150)"><rect width="400" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Unified ProcessHandle</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="352" height="135" rx="18" fill="#1b3a63" stroke="#34d399"/><text x="18" y="36" class="nt">Pipe branch</text><text x="18" y="70" class="mono">stdin pipe</text><text x="18" y="96" class="mono">stdout + stderr</text></g>
    <g transform="translate(24 260)" filter="url(#s)"><rect width="352" height="150" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">PTY branch</text><text x="18" y="70" class="mono">terminal read/write</text><text x="18" y="96" class="tx">CRLF 规范化 · ANSI 清理</text><text x="18" y="123" class="tx">共用 output buffer + read offset</text></g>
  </g>
  <g transform="translate(980 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">write_stdin / cleanup</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="135" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">Terminal input</text><text x="18" y="70" class="tx">字符写入 PTY 主端</text><text x="18" y="96" class="mono">Ctrl-C → byte 0x03</text></g>
    <g transform="translate(24 265)" filter="url(#s)"><rect width="302" height="145" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">Exit ordering</text><text x="18" y="70" class="tx">wait child → close PTY</text><text x="18" y="96" class="tx">drain output → close done</text><text x="18" y="123" class="tx">返回 exit_code 并移除 store</text></g>
  </g>
  <path d="M420 430H490" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M900 430H970" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(70 755)"><rect width="1260" height="97" rx="20" fill="#fff8ee"/><text x="28" y="34" class="nh">核心思想</text><text x="28" y="63" class="note">PTY 不是另一套工具循环，只是 UnifiedExecProcess 的一种传输句柄。策略、审批、Sandbox、session_id 和 History 回写全部复用，差异只封装在进程输入输出层。</text></g>
</svg>
