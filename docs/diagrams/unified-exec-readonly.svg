<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102747"/><stop offset="1" stop-color="#08172d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity=".36"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f9733d"/></marker>
    <style>.title{font:700 36px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#9aabc1}.lane{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#dbeafe}.nt{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.tx{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#b8c5d8}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}.nh{font:700 17px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#172d4f}.note{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#40536e}</style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><circle cx="1300" cy="80" r="190" fill="#f9733d" opacity=".07"/><circle cx="80" cy="830" r="230" fill="#38bdf8" opacity=".05"/>
  <text x="70" y="72" class="title">TurnEnvironment → read-only exec_command</text><text x="70" y="105" class="sub">遵循 Codex unified exec：环境解析、策略判断、Sandbox、输出回写</text>
  <g transform="translate(70 150)"><rect width="300" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">ToolInvocation</text>
    <g transform="translate(24 85)" filter="url(#s)"><rect width="252" height="135" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">FunctionCall</text><text x="18" y="69" class="mono">name: exec_command</text><text x="18" y="95" class="mono">cmd + workdir</text><text x="18" y="118" class="tx">call_id 贯穿结果</text></g>
    <g transform="translate(24 285)" filter="url(#s)"><rect width="252" height="125" rx="18" fill="#1b3a63" stroke="#a78bfa"/><text x="18" y="36" class="nt">TurnEnvironment</text><text x="18" y="69" class="mono">cwd</text><text x="18" y="95" class="mono">workspace_root</text></g>
  </g>
  <g transform="translate(445 150)"><rect width="430" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Policy / Runtime</text>
    <g transform="translate(24 78)" filter="url(#s)"><rect width="382" height="105" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">Read-only ExecPolicy</text><text x="18" y="69" class="tx">只读命令 → 允许；其他 → requires approval</text></g>
    <g transform="translate(24 215)" filter="url(#s)"><rect width="382" height="105" rx="18" fill="#1b3a63" stroke="#a78bfa"/><text x="18" y="36" class="nt">Resolve workdir</text><text x="18" y="69" class="tx">相对 WorkspaceRoot，拒绝路径逃逸</text></g>
    <g transform="translate(24 352)" filter="url(#s)"><rect width="382" height="105" rx="18" fill="#1b3a63" stroke="#34d399"/><text x="18" y="36" class="nt">macOS Seatbelt</text><text x="18" y="69" class="tx">工作区只读 · 禁止写入 · 禁止网络</text></g>
    <path d="M215 183V205" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M215 320V342" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g transform="translate(950 150)"><rect width="380" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Process / History</text>
    <g transform="translate(24 82)" filter="url(#s)"><rect width="332" height="120" rx="18" fill="#1b3a63" stroke="#34d399"/><text x="18" y="36" class="nt">zsh -c</text><text x="18" y="69" class="tx">context timeout + stdout/stderr</text><text x="18" y="94" class="tx">输出预算与截断</text></g>
    <g transform="translate(24 265)" filter="url(#s)"><rect width="332" height="155" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">FunctionCallOutput</text><text x="18" y="69" class="mono">exit_code</text><text x="18" y="95" class="mono">wall_time_seconds</text><text x="18" y="121" class="mono">output / truncated</text></g>
    <text x="28" y="472" class="tx">写回 History → 下一 Step</text>
  </g>
  <path d="M370 400H435" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M875 400H940" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(70 755)"><rect width="1260" height="97" rx="20" fill="#fff8ee"/><text x="28" y="34" class="nh">为什么没有 read_file / list_files？</text><text x="28" y="63" class="note">Codex Core 的本地读取走 exec_command；read_file 只可能来自外部 MCP filesystem Server。保持这个边界，才能继续正确理解 Approval、Sandbox 与长进程管理。</text></g>
</svg>
