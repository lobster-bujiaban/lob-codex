<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><style>.title{font:700 36px system-ui;fill:#f8fafc}.sub{font:18px system-ui;fill:#9fb2cc}.head{font:700 20px system-ui;fill:#f8fafc}.text{font:16px system-ui;fill:#c8d5e8}.mono{font:700 15px ui-monospace;fill:#f8fafc}</style></defs>
  <rect width="1400" height="900" fill="#0b223f"/><circle cx="1320" cy="50" r="180" fill="#f9733d" opacity=".08"/><circle cx="20" cy="860" r="250" fill="#38bdf8" opacity=".06"/>
  <text x="70" y="72" class="title">Thread → Session → Workspace</text><text x="70" y="105" class="sub">每个对话绑定独立 Session 与规范化工作区，不再共享服务启动目录</text>
  <g transform="translate(70 155)"><rect width="360" height="510" rx="26" fill="#16375e" stroke="#315d8f"/><text x="26" y="48" class="head">1. Thread start</text>
    <rect x="24" y="82" width="312" height="150" rx="18" fill="#20466f" stroke="#38bdf8"/><text x="44" y="120" class="head">Workspace selection</text><text x="44" y="160" class="mono">workspace_root</text><text x="44" y="197" class="text">绝对路径 · symlink 规范化</text>
    <rect x="24" y="272" width="312" height="160" rx="18" fill="#20466f" stroke="#f9733d"/><text x="44" y="312" class="head">Thread metadata</text><text x="44" y="352" class="mono">tmp/threads/{id}.json</text><text x="44" y="390" class="text">Git 忽略 · 原子写入</text></g>
  <path d="M430 405H490" stroke="#f9733d" stroke-width="5"/><path d="M490 405l-25-15v30z" fill="#f9733d"/>
  <g transform="translate(500 155)"><rect width="400" height="510" rx="26" fill="#16375e" stroke="#315d8f"/><text x="26" y="48" class="head">2. Thread-owned Session</text>
    <rect x="24" y="82" width="352" height="150" rx="18" fill="#20466f" stroke="#2dd4bf"/><text x="44" y="120" class="head">Lazy Session creation</text><text x="44" y="160" class="mono">thread_id → Session IO</text><text x="44" y="197" class="text">History、审批、进程互相隔离</text>
    <rect x="24" y="272" width="352" height="160" rx="18" fill="#20466f" stroke="#a78bfa"/><text x="44" y="312" class="head">TurnEnvironment</text><text x="44" y="352" class="mono">cwd = workspace_root</text><text x="44" y="390" class="text">Step 捕获同一环境边界</text></g>
  <path d="M900 405H960" stroke="#f9733d" stroke-width="5"/><path d="M960 405l-25-15v30z" fill="#f9733d"/>
  <g transform="translate(970 155)"><rect width="360" height="510" rx="26" fill="#16375e" stroke="#315d8f"/><text x="26" y="48" class="head">3. Route and resume</text>
    <rect x="24" y="82" width="312" height="150" rx="18" fill="#20466f" stroke="#38bdf8"/><text x="44" y="120" class="head">Chat / Approval</text><text x="44" y="160" class="mono">request.thread_id</text><text x="44" y="197" class="text">始终路由到所属 Session</text>
    <rect x="24" y="272" width="312" height="160" rx="18" fill="#20466f" stroke="#f9733d"/><text x="44" y="312" class="head">Server restart</text><text x="44" y="352" class="mono">load thread metadata</text><text x="44" y="390" class="text">恢复 workspace；History 待补</text></g>
  <g transform="translate(70 720)"><rect width="1260" height="120" rx="22" fill="#fff8ee"/><text x="28" y="42" style="font:700 18px system-ui;fill:#173457">核心边界</text><text x="28" y="78" style="font:16px system-ui;fill:#34516f">Thread 是 App Server 路由单位，Session 是运行时状态所有者，Workspace 通过 TurnEnvironment 进入每次工具调用。</text></g>
</svg>
