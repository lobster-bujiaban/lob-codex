<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102747"/><stop offset="1" stop-color="#08172d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity=".36"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f9733d"/></marker>
    <style>.title{font:700 36px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#9aabc1}.lane{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#dbeafe}.nt{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.tx{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#b8c5d8}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}.nh{font:700 17px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#172d4f}.note{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#40536e}</style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><circle cx="1300" cy="80" r="190" fill="#f9733d" opacity=".07"/><circle cx="80" cy="830" r="230" fill="#38bdf8" opacity=".05"/>
  <text x="70" y="72" class="title">UnifiedExec ProcessManager → write_stdin</text><text x="70" y="105" class="sub">yield 不是 timeout：未结束的进程进入 Session store，后续工具调用继续交互</text>
  <g transform="translate(70 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">exec_command</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="115" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">Spawn process</text><text x="18" y="69" class="tx">stdin pipe + stdout/stderr buffer</text><text x="18" y="94" class="tx">分配递增 session_id</text></g>
    <g transform="translate(24 235)" filter="url(#s)"><rect width="302" height="105" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">Wait until yield</text><text x="18" y="69" class="mono">250ms … 30000ms</text></g>
    <g transform="translate(24 385)" filter="url(#s)"><rect width="302" height="75" rx="18" fill="#253b5d" stroke="#a78bfa"/><text x="18" y="31" class="nt">Still running</text><text x="18" y="57" class="mono">return session_id</text></g>
    <path d="M175 195V225" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M175 340V375" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g transform="translate(500 150)"><rect width="400" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Session Process Store</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="352" height="150" rx="18" fill="#1b3a63" stroke="#a78bfa"/><text x="18" y="36" class="nt">managedProcess</text><text x="18" y="70" class="mono">session_id · command · stdin</text><text x="18" y="96" class="mono">output · read_offset · done</text><text x="18" y="123" class="tx">interaction mutex 串行化交互</text></g>
    <g transform="translate(24 285)" filter="url(#s)"><rect width="352" height="120" rx="18" fill="#1b3a63" stroke="#34d399"/><text x="18" y="36" class="nt">Incremental output</text><text x="18" y="70" class="tx">每次只消费 read_offset 之后的数据</text><text x="18" y="96" class="tx">Session Close 清理全部进程</text></g>
  </g>
  <g transform="translate(980 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">write_stdin</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="130" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">Interact</text><text x="18" y="70" class="mono">chars != "" → write</text><text x="18" y="96" class="mono">chars == "" → poll</text></g>
    <g transform="translate(24 260)" filter="url(#s)"><rect width="302" height="145" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">Observe state</text><text x="18" y="70" class="mono">running → session_id</text><text x="18" y="97" class="mono">finished → exit_code</text><text x="18" y="123" class="tx">完成后从 store 删除</text></g>
    <text x="28" y="470" class="tx">FunctionCallOutput → 下一 Step</text>
  </g>
  <path d="M420 430H490" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M900 430H970" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(70 755)"><rect width="1260" height="97" rx="20" fill="#fff8ee"/><text x="28" y="34" class="nh">核心思想</text><text x="28" y="63" class="note">yield 只决定本次工具调用等多久，不决定进程寿命。ProcessManager 把 OS 进程变成可被模型后续调用引用的 Session 资源，并保证每次交互只返回新增事实。</text></g>
</svg>
