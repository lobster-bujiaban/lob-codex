<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102747"/><stop offset="1" stop-color="#08172d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity=".36"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f9733d"/></marker>
    <style>.title{font:700 36px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#9aabc1}.lane{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#dbeafe}.nt{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.tx{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#b8c5d8}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}.nh{font:700 17px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#172d4f}.note{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#40536e}</style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><circle cx="1300" cy="80" r="190" fill="#f9733d" opacity=".07"/><circle cx="80" cy="830" r="230" fill="#38bdf8" opacity=".05"/>
  <text x="70" y="72" class="title">Exec Approval → Sandbox → Follow-up</text><text x="70" y="105" class="sub">先注册回调，再发请求；Turn 暂停等待，但 Session submission loop 保持可响应</text>
  <g transform="translate(70 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">ExecPolicy / Session</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="105" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">NeedsApproval</text><text x="18" y="69" class="tx">命令超出自动只读策略</text></g>
    <g transform="translate(24 220)" filter="url(#s)"><rect width="302" height="120" rx="18" fill="#1b3a63" stroke="#a78bfa"/><text x="18" y="36" class="nt">Register pending</text><text x="18" y="69" class="mono">call_id + turn_id</text><text x="18" y="95" class="tx">一次性 decision channel</text></g>
    <g transform="translate(24 380)" filter="url(#s)"><rect width="302" height="75" rx="18" fill="#253b5d" stroke="#38bdf8"/><text x="18" y="32" class="nt">Turn waits</text><text x="18" y="58" class="tx">submission loop 仍可接收 Op</text></g>
    <path d="M175 185V210" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M175 340V370" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g transform="translate(500 150)"><rect width="400" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">App Server / GUI</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="352" height="115" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">ExecApprovalRequest</text><text x="18" y="69" class="mono">command · cwd · reason</text><text x="18" y="94" class="tx">NDJSON 流推送审批卡片</text></g>
    <g transform="translate(24 250)" filter="url(#s)"><rect width="352" height="145" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">用户决定</text><text x="18" y="72" class="mono">批准一次</text><text x="18" y="100" class="mono">拒绝</text><text x="18" y="126" class="tx">POST /api/approvals/{call_id}</text></g>
    <path d="M200 195V240" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g transform="translate(980 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Decision branches</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="135" rx="18" fill="#1b3a63" stroke="#34d399"/><text x="18" y="36" class="nt">Approved</text><text x="18" y="70" class="tx">Seatbelt 中执行</text><text x="18" y="96" class="tx">工作区可写 · 网络仍禁止</text></g>
    <g transform="translate(24 260)" filter="url(#s)"><rect width="302" height="135" rx="18" fill="#1b3a63" stroke="#ef6b63"/><text x="18" y="36" class="nt">Denied</text><text x="18" y="70" class="tx">不启动进程</text><text x="18" y="96" class="tx">拒绝写入 FunctionCallOutput</text></g>
    <text x="28" y="462" class="tx">两条分支都回到 History → 下一 Step</text>
  </g>
  <path d="M420 430H490" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M900 430H970" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(70 755)"><rect width="1260" height="97" rx="20" fill="#fff8ee"/><text x="28" y="34" class="nh">核心思想</text><text x="28" y="63" class="note">审批不是另开一个任务，而是活跃 Turn 内的一次异步暂停。决策必须精确匹配调用，取消必须清理等待；拒绝是模型可恢复的工具结果，不是 Session 崩溃。</text></g>
</svg>
