<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102747"/><stop offset="1" stop-color="#08172d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity=".36"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f9733d"/></marker>
    <style>.title{font:700 36px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#9aabc1}.lane{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#dbeafe}.nt{font:700 18px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#f8fafc}.tx{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#b8c5d8}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}.nh{font:700 17px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#172d4f}.note{font:400 14px Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#40536e}</style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><circle cx="1300" cy="80" r="190" fill="#f9733d" opacity=".07"/><circle cx="80" cy="830" r="230" fill="#38bdf8" opacity=".05"/>
  <text x="70" y="72" class="title">ExecPolicy → approved_for_session → Prefix Rule</text><text x="70" y="105" class="sub">规则匹配 argv token，不匹配原始字符串；复合 Shell 命令不生成可复用授权</text>
  <g transform="translate(70 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Parse / Evaluate</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="120" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">Simple argv parser</text><text x="18" y="70" class="tx">处理引号与反斜杠</text><text x="18" y="96" class="mono">go test ./...</text></g>
    <g transform="translate(24 245)" filter="url(#s)"><rect width="302" height="145" rx="18" fill="#1b3a63" stroke="#a78bfa"/><text x="18" y="36" class="nt">ExecPolicy Evaluate</text><text x="18" y="70" class="tx">① 内置只读规则</text><text x="18" y="97" class="tx">② Session prefix rules</text><text x="18" y="123" class="tx">③ NeedsApproval</text></g>
  </g>
  <g transform="translate(500 150)"><rect width="400" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Approval decision</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="352" height="130" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">Proposed prefix</text><text x="18" y="70" class="mono">["go", "test"]</text><text x="18" y="97" class="tx">至少两个 token，必须是当前命令前缀</text></g>
    <g transform="translate(24 260)" filter="url(#s)"><rect width="352" height="145" rx="18" fill="#1b3a63" stroke="#34d399"/><text x="18" y="36" class="nt">ApprovedForSession</text><text x="18" y="70" class="tx">写入 Session 内存规则</text><text x="18" y="97" class="tx">当前命令继续进入 Sandbox</text><text x="18" y="123" class="tx">不写磁盘</text></g>
  </g>
  <g transform="translate(980 150)"><rect width="350" height="500" rx="24" fill="#132d50" stroke="#315078"/><text x="26" y="44" class="lane">Next command</text>
    <g transform="translate(24 80)" filter="url(#s)"><rect width="302" height="135" rx="18" fill="#1b3a63" stroke="#38bdf8"/><text x="18" y="36" class="nt">Token prefix match</text><text x="18" y="70" class="mono">[go,test] ⊆ [go,test,./...]</text><text x="18" y="98" class="tx">逐 token 比较</text></g>
    <g transform="translate(24 265)" filter="url(#s)"><rect width="302" height="145" rx="18" fill="#1b3a63" stroke="#f9733d"/><text x="18" y="36" class="nt">Skip prompt</text><text x="18" y="70" class="tx">直接进入 Seatbelt</text><text x="18" y="97" class="mono">policy_rule: session prefix</text><text x="18" y="123" class="tx">GUI 展示命中规则</text></g>
  </g>
  <path d="M420 430H490" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/><path d="M900 430H970" stroke="#f9733d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(70 755)"><rect width="1260" height="97" rx="20" fill="#fff8ee"/><text x="28" y="34" class="nh">核心思想</text><text x="28" y="63" class="note">ApprovedForSession 缓存的是结构化命令前缀，不是“记住这段字符串”。它只活在当前 Session，并且不能从含 ;、|、重定向或命令替换的复合脚本推导。</text></g>
</svg>
