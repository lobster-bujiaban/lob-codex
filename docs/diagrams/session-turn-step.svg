<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #e5e7eb; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #94a3b8; }
      .lane-title { font-size: 18px; font-weight: 650; }
      .node-title { font-size: 17px; font-weight: 650; }
      .node-sub { font-size: 13px; fill: #a8b3c4; }
      .small { font-size: 12px; fill: #94a3b8; }
      .card-title { font-size: 15px; font-weight: 650; }
      .card-text { font-size: 13px; fill: #a8b3c4; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .event-edge { fill: none; stroke: #38bdf8; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .loop-edge { fill: none; stroke: #f59e0b; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>
  <text x="70" y="66" class="title">Codex Session → Turn → Step 主链</text>
  <text x="70" y="98" class="subtitle">Go 等价实现：公开协议事件与内部采样状态严格分层</text>

  <!-- Lanes -->
  <rect x="60" y="135" width="300" height="700" rx="22" fill="#0f1b2d" stroke="#22324b"/>
  <rect x="380" y="135" width="420" height="700" rx="22" fill="#101b2a" stroke="#22324b"/>
  <rect x="820" y="135" width="710" height="700" rx="22" fill="#121a27" stroke="#22324b"/>
  <text x="90" y="174" class="lane-title" fill="#7dd3fc">客户端 / App Server</text>
  <text x="410" y="174" class="lane-title" fill="#86efac">Session 调度层</text>
  <text x="850" y="174" class="lane-title" fill="#fbbf24">Turn 任务与采样循环</text>

  <!-- Client lane -->
  <g filter="url(#shadow)">
    <rect x="95" y="220" width="230" height="82" rx="14" fill="#16243a" stroke="#38bdf8"/>
    <text x="210" y="252" text-anchor="middle" class="node-title">CLI / GUI</text>
    <text x="210" y="278" text-anchor="middle" class="node-sub">提交用户输入</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="355" width="230" height="105" rx="14" fill="#16243a" stroke="#38bdf8"/>
    <text x="210" y="387" text-anchor="middle" class="node-title">SessionIO.Submit</text>
    <text x="210" y="413" text-anchor="middle" class="node-sub">生成 Submission ID</text>
    <text x="210" y="436" text-anchor="middle" class="node-sub">封装 Op::TurnInput</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="630" width="230" height="125" rx="14" fill="#112b3b" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="663" text-anchor="middle" class="node-title">公开 Event 流</text>
    <text x="210" y="690" text-anchor="middle" class="node-sub">TurnStarted</text>
    <text x="210" y="713" text-anchor="middle" class="node-sub">AgentMessageContentDelta</text>
    <text x="210" y="736" text-anchor="middle" class="node-sub">TurnComplete / Aborted</text>
  </g>

  <!-- Session lane -->
  <g filter="url(#shadow)">
    <rect x="430" y="245" width="320" height="92" rx="14" fill="#162a24" stroke="#4ade80"/>
    <text x="590" y="279" text-anchor="middle" class="node-title">submissionLoop</text>
    <text x="590" y="305" text-anchor="middle" class="node-sub">长生命周期 · 持续分派 Op</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="385" width="320" height="115" rx="14" fill="#162a24" stroke="#4ade80"/>
    <text x="590" y="418" text-anchor="middle" class="node-title">handleTurnInput</text>
    <text x="590" y="444" text-anchor="middle" class="node-sub">Codex：start / steer / reject</text>
    <text x="590" y="470" text-anchor="middle" class="small">当前：start 已实现，其余待对齐</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="555" width="320" height="105" rx="14" fill="#162a24" stroke="#4ade80"/>
    <text x="590" y="589" text-anchor="middle" class="node-title">spawnRegularTask</text>
    <text x="590" y="615" text-anchor="middle" class="node-sub">建立 TurnContext</text>
    <text x="590" y="638" text-anchor="middle" class="node-sub">后台 goroutine + cancellation</text>
  </g>

  <!-- Turn lane -->
  <g filter="url(#shadow)">
    <rect x="870" y="205" width="265" height="84" rx="14" fill="#302711" stroke="#fbbf24"/>
    <text x="1002" y="238" text-anchor="middle" class="node-title">RegularTask.run</text>
    <text x="1002" y="264" text-anchor="middle" class="node-sub">发送 TurnStarted</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="335" width="265" height="90" rx="14" fill="#302711" stroke="#fbbf24"/>
    <text x="1002" y="370" text-anchor="middle" class="node-title">runTurn</text>
    <text x="1002" y="396" text-anchor="middle" class="node-sub">Turn 内采样循环</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="475" width="265" height="105" rx="14" fill="#302711" stroke="#f59e0b"/>
    <text x="1002" y="510" text-anchor="middle" class="node-title">captureStepContext</text>
    <text x="1002" y="536" text-anchor="middle" class="node-sub">每次采样前的不可变请求视图</text>
    <text x="1002" y="559" text-anchor="middle" class="small">内部状态，不对外发 Step 事件</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1200" y="335" width="270" height="110" rx="14" fill="#241b39" stroke="#c084fc"/>
    <text x="1335" y="369" text-anchor="middle" class="node-title">runSamplingRequest</text>
    <text x="1335" y="395" text-anchor="middle" class="node-sub">消费内部 ResponseEvent</text>
    <text x="1335" y="420" text-anchor="middle" class="small">Responses API SSE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1200" y="500" width="270" height="105" rx="14" fill="#241b39" stroke="#c084fc"/>
    <text x="1335" y="534" text-anchor="middle" class="node-title">事件映射</text>
    <text x="1335" y="560" text-anchor="middle" class="node-sub">ResponseEvent → EventMsg</text>
    <text x="1335" y="583" text-anchor="middle" class="small">模型层与公开协议层分离</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="1200,675 1335,625 1470,675 1335,725" fill="#302711" stroke="#f59e0b"/>
    <text x="1335" y="674" text-anchor="middle" class="node-title">needs_follow_up?</text>
    <text x="1335" y="697" text-anchor="middle" class="small">工具结果 / pending input</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="675" width="265" height="105" rx="14" fill="#162a24" stroke="#4ade80"/>
    <text x="1002" y="710" text-anchor="middle" class="node-title">onTaskFinished</text>
    <text x="1002" y="736" text-anchor="middle" class="node-sub">统一收口任务生命周期</text>
    <text x="1002" y="759" text-anchor="middle" class="small">TurnComplete / TurnAborted</text>
  </g>

  <!-- Edges -->
  <path d="M210 302 L210 355" class="edge"/>
  <path d="M325 407 C365 407, 385 291, 430 291" class="edge"/>
  <path d="M590 337 L590 385" class="edge"/>
  <path d="M590 500 L590 555" class="edge"/>
  <path d="M750 607 C810 607, 820 247, 870 247" class="edge"/>
  <path d="M1002 289 L1002 335" class="event-edge"/>
  <path d="M1002 425 L1002 475" class="edge"/>
  <path d="M1135 528 C1170 528, 1170 390, 1200 390" class="edge"/>
  <path d="M1335 445 L1335 500" class="edge"/>
  <path d="M1335 605 L1335 625" class="edge"/>
  <path d="M1200 675 C1150 675, 1160 727, 1135 727" class="edge"/>
  <text x="1160" y="704" class="small">否</text>
  <path d="M1470 675 C1510 675, 1510 380, 1470 380" class="loop-edge"/>
  <text x="1490" y="525" class="small" fill="#fbbf24">是：下一次采样</text>
  <path d="M870 727 C700 727, 530 692, 325 692" class="event-edge"/>
  <path d="M870 247 C690 205, 420 650, 325 670" class="event-edge"/>
  <path d="M1200 552 C850 610, 580 705, 325 713" class="event-edge"/>

  <!-- Key ideas -->
  <text x="70" y="885" class="lane-title">核心思想</text>
  <g>
    <rect x="70" y="910" width="345" height="115" rx="16" fill="#111d30" stroke="#29405f"/>
    <text x="92" y="942" class="card-title">1. Session 是长生命周期所有者</text>
    <text x="92" y="970" class="card-text">模型客户端、Submission 通道、活动任务和</text>
    <text x="92" y="993" class="card-text">Event 流都归 Session 管理，不按请求重建。</text>
  </g>
  <g>
    <rect x="445" y="910" width="345" height="115" rx="16" fill="#111d30" stroke="#29405f"/>
    <text x="467" y="942" class="card-title">2. Submission ID 贯穿完整 Turn</text>
    <text x="467" y="970" class="card-text">提交、TurnContext 和公开 Event 使用同一 ID，</text>
    <text x="467" y="993" class="card-text">客户端据此关联一次任务的全部生命周期。</text>
  </g>
  <g>
    <rect x="820" y="910" width="345" height="115" rx="16" fill="#111d30" stroke="#29405f"/>
    <text x="842" y="942" class="card-title">3. Step 是内部采样快照</text>
    <text x="842" y="970" class="card-text">每次模型请求前捕获一致的上下文和工具视图，</text>
    <text x="842" y="993" class="card-text">Step 本身不是公开 UI 生命周期事件。</text>
  </g>
  <g>
    <rect x="1195" y="910" width="335" height="115" rx="16" fill="#111d30" stroke="#29405f"/>
    <text x="1217" y="942" class="card-title">4. Task 终态统一收口</text>
    <text x="1217" y="970" class="card-text">正常、错误或取消都由 onTaskFinished 统一</text>
    <text x="1217" y="993" class="card-text">产生 TurnComplete 或 TurnAborted。</text>
  </g>

  <!-- Legend -->
  <circle cx="1160" cy="92" r="7" fill="#38bdf8"/><text x="1175" y="98" class="small">公开协议事件</text>
  <circle cx="1300" cy="92" r="7" fill="#f59e0b"/><text x="1315" y="98" class="small">内部 Turn/Step</text>
  <circle cx="1435" cy="92" r="7" fill="#c084fc"/><text x="1450" y="98" class="small">模型采样</text>
</svg>
